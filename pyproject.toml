[project]
name = "bellwether"
version = "0.1.0"
description = "Predictive and advisory reliability service for self-hosted MongoDB replica sets"
readme = "README.md"
license = { file = "LICENSE" }
requires-python = ">=3.11"
dependencies = [
    "anthropic>=0.60",
    "fastapi>=0.115",
    "openai>=1.60",
    "pydantic>=2.7",
    "pydantic-settings>=2.3",
    "pymongo>=4.9",
    "pyyaml>=6.0",
    "uvicorn>=0.30",
]

[project.scripts]
bellwether = "bellwether.cli:main"

[dependency-groups]
dev = [
    "jsonschema>=4.26.0",
    "mypy>=1.10",
    "pytest>=8.0",
    "types-jsonschema>=4.26.0.20260518",
    "types-PyYAML>=6.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["bellwether"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.mypy]
strict = true
python_version = "3.11"  # the declared minimum (requires-python)
plugins = ["pydantic.mypy"]

[tool.pydantic-mypy]
init_forbid_extra = true
init_typed = true
warn_required_dynamic_aliases = true
