# Bellwether example configuration — grounded in the rs0 cluster (BUILD_SPEC §1).
#
# Every value here can be overridden by an env var: BELLWETHER_<SECTION>__<KEY>,
# e.g. BELLWETHER_PROMETHEUS__BASE_URL. Lists take JSON:
#   BELLWETHER_MONGO__FALLBACK_NODES='["node-uae.mongo.internal:27017"]'
#
# SECRETS NEVER GO IN THIS FILE. A secret key found here is a load-time error.
# Required at load time for the features enabled below:
#   BELLWETHER_ANALYSIS__ANTHROPIC_API_KEY    (claude is a provider)
#   BELLWETHER_ANALYSIS__OPENAI_API_KEY       (openai is a provider)
#   BELLWETHER_NOTIFY__SLACK_WEBHOOK_URL      (slack is a channel)
#   BELLWETHER_NOTIFY__SLACK_SIGNING_SECRET   (slack is a channel)
# Optional (only if the client key is encrypted):
#   BELLWETHER_MONGO__TLS_CERT_PASSPHRASE
#   BELLWETHER_EXECUTOR__TLS_CERT_PASSPHRASE
#
# CERTIFICATES NEVER GO IN A URI. URIs carry host + auth options only; the cert
# and CA are the tls_* fields below. tlsCertificateKeyFile / tlsCAFile in a URI
# is a load-time error.

mongo:
  # Read identity meetadev-ai (clusterMonitor@admin, read@local,
  # read@meetadev_ledger). X.509 over mutual TLS; hostname verification stays on.
  # The host here is replaced per attempt by target_node, then fallback_nodes.
  # In a systemd unit, write %24external as %%24external.
  uri: "mongodb://node-backup.mongo.internal:27017/?authMechanism=MONGODB-X509&authSource=%24external&tls=true&directConnection=true"
  tls_ca_file: /etc/mongodb/tls/ca-chain.cert.pem
  tls_cert_file: /etc/bellwether/tls/meetadev-ai.combined.pem   # cert + key, one PEM
  # Hidden, non-voting, priority-0 member: diagnostic reads never land on the primary.
  target_node: node-backup.mongo.internal:27017
  # Tried in order if the target is unreachable — nearest voter to the
  # West-Europe monitoring host first.
  fallback_nodes:
    - node-westeurope.mongo.internal:27017
    - node-uae.mongo.internal:27017
    - node-southafrica.mongo.internal:27017

prometheus:
  enabled: true
  base_url: http://10.3.2.4:9090

analysis:
  primary_provider: claude
  fallback_provider: openai      # or null to run Claude-only
  claude_model: claude-opus-5
  openai_model: gpt-5            # placeholder — confirm the real model name
  max_retries: 1                 # retries after the first attempt, per provider
  timeout_seconds: 120           # per provider call, before failing over
  escalate_min_severity: warning # info | warning | critical

notify:
  channels:
    - stdout
    - slack

approval:
  # Slack user IDs (U…/W…, not display names) allowed to Approve or Reject from
  # Slack. A verified click from anyone else is refused (403), changes nothing,
  # and is recorded as an audit event. Empty = nobody: `bellwether serve`
  # refuses to start until this is set.
  # Env: BELLWETHER_APPROVAL__APPROVER_IDS='["U0123ABCD"]'
  approver_ids: []

store:
  sqlite_path: /var/lib/bellwether/bellwether.db

collectors:
  oplog_window:
    # Two serverStatus reads this far apart measure the live write rate on a
    # secondary; 0 disables sampling (mean rate over the window is used).
    sample_interval_seconds: 10

detectors:
  oplog_window:
    # Conservative resync estimate: the longest a secondary may be down.
    maintenance_window_seconds: 3600
    # WARNING while the window is under resync x safety_factor; CRITICAL under resync.
    safety_factor: 2.0

executor:
  # Write identity meetadev-ai-exec — distinct from the read identity above,
  # with its own cert. Off until an operator deliberately turns it on.
  enabled: false
  # Replica-set URI: every voting member, replicaSet=rs0, NO directConnection,
  # so create_small_index goes wherever the driver finds the primary. kill_op
  # instead connects directly to the member the runaway op runs on (the
  # finding's node), reusing this URI's auth options with that single host.
  # PLACEHOLDER — the meetadev-ai-exec identity has not been provisioned.
  mongo_uri: "mongodb://node-westeurope.mongo.internal:27017,node-uae.mongo.internal:27017,node-southafrica.mongo.internal:27017/?replicaSet=rs0&authMechanism=MONGODB-X509&authSource=%24external&tls=true"
  tls_cert_file: /etc/bellwether/tls/meetadev-ai-exec.combined.pem  # PLACEHOLDER path
  tls_ca_file: /etc/mongodb/tls/ca-chain.cert.pem
  # create_small_index refuses collections estimated above this many documents.
  document_threshold: 100000
  # The whitelist is fixed in code; config can only narrow it.
  allowed_actions:
    - kill_op
    - create_small_index
